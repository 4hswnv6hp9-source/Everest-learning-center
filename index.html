<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Everest – branches promo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600;800&display=swap">
<style>
:root{--bg:#f4f0e8;--fg:#17181d;--card:#fff;--bd:#d9d3c7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f14;--fg:#f2f0ea;--card:#1a1c25;--bd:#2c2f3b}}
:root[data-theme="dark"]{--bg:#0e0f14;--fg:#f2f0ea;--card:#1a1c25;--bd:#2c2f3b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px}
.w{width:min(100%,calc(70dvh*9/16));min-width:min(100%,300px)}
.stage{position:relative;width:min(100%,calc(70dvh*9/16));min-width:min(100%,300px);aspect-ratio:9/16;container-type:size;overflow:hidden;border-radius:14px;background:#EAF3FC;color:#0B2A5B;--a:#1F5FAF;transition:color .6s;font-family:Montserrat,"Segoe UI",system-ui,sans-serif}
.stage.dk{color:#fff;--a:#9CCBFF}
#scene{position:absolute;inset:0}
.sc{--t:#0B2A5B;--m:#4A6585;--a:#1F5FAF;--bgc:#fff;color:var(--t);position:absolute;inset:0;overflow:hidden;background:radial-gradient(90% 55% at var(--gx) var(--gy),var(--g2),transparent 70%),linear-gradient(180deg,#B9D6F2,#E9F3FC 60%,#fff)}
.sc.dk{--t:#fff;--m:#C6D8F0;--a:#9CCBFF;--bgc:#0A2150;background:radial-gradient(90% 55% at var(--gx) var(--gy),var(--g2),transparent 70%),linear-gradient(175deg,#16407A,#0A2150 70%,#071A40)}
.sc.in{animation:sin .9s cubic-bezier(.2,.7,.2,1) both}
.sc.out{animation:sout .6s ease-in both}
.cam{position:absolute;inset:-4%;animation:kb 9s linear both}
.cd b{position:absolute;border-radius:50%;background:rgba(255,255,255,.75);filter:blur(2.6cqw);animation:bkf 9s ease-in-out infinite alternate}
.dk .cd b{background:rgba(150,195,255,.18)}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3.5cqw;padding:12cqw 8cqw 12cqw 12cqw}
.ml{overflow:hidden;padding-bottom:.14em;margin-bottom:-.14em;line-height:1.05}
.mi{animation:mi .9s cubic-bezier(.2,.8,.2,1) both}
.fu{animation:fu .8s cubic-bezier(.2,.7,.2,1) both}
.ac{font-weight:800;color:var(--a)}
.lb{font:500 3.2cqw Montserrat,system-ui,sans-serif;letter-spacing:.3em;color:var(--a)}
.sub{font:500 4.4cqw/1.3 Montserrat,system-ui,sans-serif;color:var(--m);letter-spacing:.03em}
.ln{height:.5cqw;width:26cqw;background:var(--a);transform-origin:left;animation:gx .9s .9s cubic-bezier(.2,.8,.2,1) both}
.logo{width:54cqw;filter:drop-shadow(0 1.5cqw 3cqw rgba(11,42,91,.28));animation:logoin 1.1s cubic-bezier(.2,.8,.2,1) both}
.bug{position:absolute;top:5cqw;right:5cqw;width:19cqw;z-index:5;opacity:0;transition:opacity .6s;filter:drop-shadow(0 .8cqw 1.8cqw rgba(11,42,91,.25))}
.rgw{position:absolute;left:0;right:0;bottom:0;animation:rise 1.6s cubic-bezier(.2,.8,.2,1) both}
.rgw svg{display:block;width:100%}
.sm{position:absolute;left:62%;top:11.4%;width:0;height:0;animation:fu .6s 1.6s both}
.sm::before{content:"";position:absolute;left:-.2cqw;bottom:0;width:.5cqw;height:8cqw;background:#0B2A5B}
.sm::after{content:"";position:absolute;left:.3cqw;bottom:4.2cqw;border-left:5.5cqw solid #D93A50;border-top:1.8cqw solid transparent;border-bottom:1.8cqw solid transparent;transform-origin:left center;animation:wave 1.1s ease-in-out infinite alternate}
.sky{position:absolute;left:0;right:0;bottom:0;animation:dr 9s linear both}
.sky svg{display:block;width:100%;height:46cqw}
.wn{animation:tw 3s ease-in-out infinite alternate}
.big{font-weight:800;font-size:62cqw;line-height:.9;background:linear-gradient(180deg,var(--t) 30%,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent;animation:fu 1s .2s both}
.big.s2{font-size:30cqw}
.st{display:flex;align-items:baseline;gap:3cqw}
.sl{font:600 6cqw/1.15 Montserrat,system-ui,sans-serif}
.rings{position:absolute;right:-22cqw;bottom:26cqw;width:84cqw;height:84cqw}
.rings i{position:absolute;inset:0;border-radius:50%;border:.25cqw solid color-mix(in srgb,var(--a) 55%,transparent);animation:ring 3s linear infinite}
.rings i:nth-child(2){animation-delay:1s}.rings i:nth-child(3){animation-delay:2s}
.chips{display:flex;flex-wrap:wrap;gap:2cqw;width:100%}
.chip{font:500 3.4cqw Montserrat,system-ui,sans-serif;padding:1.6cqw 3cqw;border:.2cqw solid color-mix(in srgb,var(--t) 14%,transparent);background:rgba(255,255,255,.8);box-shadow:0 .5cqw 1.6cqw rgba(11,42,91,.08);border-radius:99cqw;white-space:nowrap;animation:pin .5s var(--d) cubic-bezier(.2,.8,.2,1) both}
.chip em{font-style:normal;font-weight:600;font-size:2.7cqw;color:var(--a);margin-right:1.4cqw}
.mapbox{position:relative;width:100%;aspect-ratio:100/88;border-radius:3cqw;background:rgba(255,255,255,.7);border:.2cqw solid color-mix(in srgb,var(--t) 16%,transparent);box-shadow:0 1cqw 4cqw rgba(11,42,91,.1);overflow:hidden;animation:fu .9s .5s both}
.mapbox>svg{position:absolute;inset:0;width:100%;height:100%}
.rt{fill:none;stroke:var(--a);stroke-width:.7;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dash 1s .9s forwards}
.pin{position:absolute;display:flex;align-items:center;gap:1.8cqw;transform:translate(-1.6cqw,-50%);animation:pin .6s var(--d) cubic-bezier(.2,.8,.2,1) both}
.pin.r{flex-direction:row-reverse;transform:translate(calc(-100% + 1.6cqw),-50%)}
.pin b{position:relative;flex:none;width:3.2cqw;height:3.2cqw;border-radius:50%;background:var(--a);box-shadow:0 0 0 .6cqw #fff,0 .6cqw 2cqw rgba(11,42,91,.3)}
.pin b::after{content:"";position:absolute;inset:0;border-radius:50%;border:.3cqw solid var(--a);animation:ring2 1.8s ease-out infinite}
.pin span{font:600 3.1cqw Montserrat,system-ui,sans-serif;background:#fff;color:#0B2A5B;border:.2cqw solid color-mix(in srgb,var(--a) 35%,transparent);box-shadow:0 .5cqw 1.6cqw rgba(11,42,91,.12);padding:1cqw 2.2cqw;border-radius:99cqw;white-space:nowrap}
.pin.hub{transform:translate(-2.3cqw,-50%)}
.pin.hub.r{transform:translate(calc(-100% + 2.3cqw),-50%)}
.pin.hub b{width:4.6cqw;height:4.6cqw;background:#0B2A5B}
.pin.hub span{background:#0B2A5B;color:#fff;border-color:#0B2A5B}
.pin.soon b{background:#fff;box-shadow:none;border:.4cqw dashed var(--a)}
.pin.soon b::after{display:none}
.ct{width:100%;border-top:.2cqw solid color-mix(in srgb,var(--t) 25%,transparent);padding:2cqw 0;display:flex;flex-direction:column;gap:.6cqw}
.ct small{font:500 2.6cqw Montserrat,system-ui,sans-serif;letter-spacing:.28em;color:var(--a)}
.ct span{font-weight:500;font-size:5.4cqw}
.cb{background:var(--t);color:var(--bgc);font:600 4cqw Montserrat,system-ui,sans-serif;letter-spacing:.12em;border-radius:99cqw;padding:2.6cqw 7cqw;animation:fu .8s 2s both,glow 1.6s 3s ease-in-out infinite alternate}
.alt{position:absolute;left:4cqw;top:12cqw;bottom:12cqw;width:2cqw;border-left:.25cqw solid color-mix(in srgb,currentColor 35%,transparent);background:repeating-linear-gradient(to bottom,color-mix(in srgb,currentColor 35%,transparent) 0 .25cqw,transparent .25cqw 3cqw);z-index:4}
.dot{position:absolute;left:-.95cqw;bottom:0;width:1.6cqw;height:1.6cqw;border-radius:50%;background:var(--a);box-shadow:0 0 0 .5cqw rgba(255,255,255,.8);transform:translateY(50%)}
.ov{position:absolute;inset:0;z-index:6;border:0;background:rgba(11,42,91,.6);color:#fff;font:300 10cqw Montserrat,system-ui,sans-serif;letter-spacing:.3em;cursor:pointer}
@keyframes sin{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
@keyframes sout{to{opacity:0}}
@keyframes kb{to{transform:scale(1.08) translate(-1.5%,-1%)}}
@keyframes dr{to{transform:translateX(-3%)}}
@keyframes mi{from{transform:translateY(110%)}to{transform:none}}
@keyframes fu{from{opacity:0;transform:translateY(3cqw)}to{opacity:1;transform:none}}
@keyframes logoin{from{opacity:0;transform:scale(.85) translateY(4cqw)}to{opacity:1;transform:none}}
@keyframes gx{from{transform:scaleX(0)}to{transform:none}}
@keyframes rise{from{transform:translateY(10cqw);opacity:0}to{transform:none;opacity:1}}
@keyframes bkf{to{transform:translateX(9cqw)}}
@keyframes wave{to{transform:scaleX(.8) skewY(4deg)}}
@keyframes tw{from{opacity:.25}to{opacity:.8}}
@keyframes ring{from{transform:scale(.2);opacity:.9}to{transform:scale(1.6);opacity:0}}
@keyframes ring2{to{transform:scale(3);opacity:0}}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes pin{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
@keyframes glow{from{box-shadow:0 0 0 rgba(156,203,255,0)}to{box-shadow:0 0 5cqw rgba(156,203,255,.55)}}
.ctl{display:flex;gap:8px}
button.b{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:600 15px system-ui,sans-serif;cursor:pointer}
button.p{background:#0B2A5B;border-color:#0B2A5B;color:#fff}
.note{font-size:13px;opacity:.75;margin:0}
</style></head>
<body>
<div class="stage" id="stage">
  <div id="scene"></div>
  <img class="bug" id="bug" alt="">
  <div class="alt"><i class="dot" id="dot"></i></div>
  <button class="ov" id="ov">PLAY</button>
</div>
<div class="w ctl"><button class="b p" id="btn">▶ Play</button><button class="b" id="snd">🔊 Sound on</button><button class="b" id="lg">🌐 EN</button></div>
<p class="note w">Tap 🌐 to switch the on-screen text between English and Uzbek. Screen-record the vertical stage, and for the most natural result lay your real branch footage under these titles in CapCut.</p>

const ridge='<div class="rgw"><svg viewBox="0 0 100 70"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".6"/></linearGradient></defs><path d="M0 70V40L14 28 22 36 38 14 50 30 62 8 78 32 88 24 100 38V70Z" fill="#B7CFEA"/><path d="M62 8L57.2 16.8 59.5 15.5 62 19 64.5 15.5 66.5 17 68.4 17.6Z" fill="#fff"/><path d="M0 70V48L18 34 30 44 46 22 58 40 72 20 86 42 100 36V70Z" fill="#86A9D2"/><path d="M0 70V58L16 46 34 56 52 38 70 54 86 44 100 52V70Z" fill="#35639F"/><rect y="40" width="100" height="30" fill="url(#fg)"/></svg><i class="sm"></i></div>';
const city='<div class="sky"><svg viewBox="0 0 100 40" preserveAspectRatio="none"><defs><pattern id="wp" width="3" height="3.4" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="1" height="1.2" fill="#BBD7FF"/></pattern><path id="sk" d="M0 40V22h8V14h7v8h5V9h9v13h6V17h8V6h7v16h7V15h8v7h6V12h9v28Z"/></defs><use href="#sk" fill="#0A2250"/><use href="#sk" fill="url(#wp)" class="wn"/></svg></div>';
const hook=()=>{const x=X[L],h=x.hook;return sc(0,`<div class="c" style="justify-content:flex-start;padding-top:13cqw"><img class="logo" src="${LOGO}" alt=""><div style="margin-top:9cqw">${ml(h[0],.9,"font-size:11cqw;font-weight:300")}${ml(h[1],1.05,"font-size:11cqw;font-weight:300")}${ml(h[2],1.25,"font-size:15cqw;font-weight:800;color:var(--a)")}</div><div class="sub fu" style="animation-delay:2.2s">${x.sub}</div></div>`,ridge)};
const big=()=>{const x=X[L];return sc(1,`<div class="rings"><i></i><i></i><i></i></div><div class="c" style="padding-bottom:46cqw"><div class="lb fu">${x.est}</div><div class="big" data-n="27">0</div>${ml(x.unit,.7,"font-size:12cqw;font-weight:300;letter-spacing:.04em")}<div class="ln"></div><div class="sub fu" style="animation-delay:1.4s">${x.sub2}</div></div>`,city,1)};
const tash=()=>{const x=X[L];return sc(2,`<div class="c" style="justify-content:flex-start;padding-top:20cqw"><div>${ml(x.tash[0],.2,"font-size:10cqw;font-weight:800")}${ml(x.tash[1],.4,"font-size:10cqw;font-weight:300;color:var(--a)")}</div><div class="chips">${TASH.map((n,i)=>`<div class="chip" style="--d:${(.8+i*.11).toFixed(2)}s"><em>${String(i+1).padStart(2,"0")}</em>${n}</div>`).join("")}</div><div class="lb fu" style="animation-delay:3.4s">@everestmanzillari</div></div>`)};
const reg=()=>{const x=X[L],H=R[0],pins=R.map((r,i)=>`<div class="pin${r[1]>50?" r":""} ${r[3]||""}" style="left:${r[1]}%;top:${r[2]}%;--d:${(.8+i*.4).toFixed(1)}s"><b></b><span>${r[0]=="hub"?x.hub:r[0]=="soon"?x.soon:r[0]}</span></div>`).join(""),
rts=R.slice(1).map((r,i)=>`<path class="rt" pathLength="1" style="animation-delay:${(1.1+i*.4).toFixed(1)}s" d="M${H[1]} ${H[2]*.88}L${r[1]} ${r[2]*.88}"/>`).join("");
return sc(3,`<div class="c" style="justify-content:flex-start;padding-top:20cqw"><div>${ml(x.reg[0],.2,"font-size:9cqw;font-weight:800")}${ml(x.reg[1],.4,"font-size:9cqw;font-weight:300;color:var(--a)")}</div><div class="mapbox"><svg viewBox="0 0 100 88" preserveAspectRatio="none"><g fill="none" stroke="currentColor" stroke-width=".25" opacity=".16"><path d="M0 22H100M0 44H100M0 66H100M25 0V88M50 0V88M75 0V88"/><circle cx="57" cy="9.7" r="30" stroke-dasharray="1 1.5"/><circle cx="57" cy="9.7" r="58" stroke-dasharray="1 1.5"/></g>${rts}</svg>${pins}</div><div class="lb fu" style="animation-delay:3.4s">@everestuzbekistan</div></div>`)};
const proof=()=>{const x=X[L];return sc(4,`<div class="c" style="padding-bottom:40cqw"><div class="st"><div class="big s2" data-n="12">0</div><div class="sl fu" style="animation-delay:.5s">${x.p1}</div></div><div class="ln"></div><div class="st"><div class="big s2" data-n="7" style="animation-delay:1s">0</div><div class="sl fu" style="animation-delay:1.3s">${x.p2}</div></div><div class="sub fu" style="animation-delay:2s;font-size:4cqw">${x.tag}</div></div>`,"")};
const cta=()=>{const x=X[L],fs=`font-size:${x.fs}cqw;`,rows=[[x.l1,"+998 78 888 80 08"],["WEBSITE","everestlc.uz"],[x.l3,"@everestmanzillari"],[x.l4,"@everestuzbekistan"]];
return sc(5,`<div class="c" style="justify-content:flex-start;padding-top:24cqw;gap:2.4cqw"><div>${ml(x.cta[0],.2,fs+"font-weight:800")}${ml(x.cta[1],.35,fs+"font-weight:800")}${ml(x.cta[2],.5,fs+"font-weight:300;color:var(--a)")}</div><div style="width:100%;margin-top:2cqw">${rows.map((r,i)=>`<div class="ct fu" style="animation-delay:${(.9+i*.2).toFixed(1)}s"><small>${r[0]}</small><span>${r[1]}</span></div>`).join("")}</div><div class="cb">${x.btn}</div>${ml(x.end,3.2,"font-size:8cqw;font-weight:300;margin-top:2cqw")}</div>`,"",1)};
let T=[],total=0,raf,t0,cur=-1,ac,mute=false,iv,bt=0;
function build(){T=[];let t=0;const add=(d,h)=>{T.push({s:t,e:t+d,h});t+=d};
add(3.8,hook);add(3.4,big);add(5.2,tash);add(5.2,reg);add(3.8,proof);add(6.5,cta);total=t}
function tone(f,d,ty,v,f2,a){if(mute||!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+(a||.005));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}
function sweep(d,v){if(mute||!ac)return;const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),t=ac.currentTime;f.type="bandpass";f.Q.value=1.2;f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(4000,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+d*.5);g.gain.linearRampToValueAtTime(.0001,t+d);s.buffer=b;s.connect(f).connect(g).connect(ac.destination);s.start()}
const CH=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]],PL=[659,587,523,587];
function beat(){if(bt%2===0)tone(130,.22,"sine",.4,45);else sweep(.06,.025);
if(bt%16===0)CH[(bt/16)%4].forEach(f=>tone(f,3.6,"sine",.04,0,.9));
if(bt%4===3)tone(PL[(bt>>2)%4],.5,"triangle",.045);bt++}
function count(el){const n=+el.dataset.n,s=performance.now()+400,f=now=>{const p=Math.min(1,Math.max(0,(now-s)/900));el.textContent=Math.round(n*p);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function show(i){cur=i;[...st.children].forEach(n=>{n.classList.add("out");setTimeout(()=>n.remove(),650)});
st.insertAdjacentHTML("beforeend",T[i].h());sweep(.7,.1);tone(60,.7,"sine",.45,38);bug.style.opacity=i>0?.95:0;$("#stage").classList.toggle("dk",DK.includes(i));
st.lastElementChild.querySelectorAll("[data-n]").forEach(count)}
function tick(now){const t=(now-t0)/1000;
if(t>=total){dot.style.bottom="100%";btn.textContent="↻ Replay";clearInterval(iv);return}
const i=T.findIndex(x=>t>=x.s&&t<x.e);if(i>=0&&i!==cur)show(i);
dot.style.bottom=t/total*100+"%";raf=requestAnimationFrame(tick)}
function play(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(x){}
cancelAnimationFrame(raf);clearInterval(iv);build();cur=-1;bt=0;ov.style.display="none";btn.textContent="↻ Replay";iv=setInterval(beat,240);t0=performance.now();raf=requestAnimationFrame(tick)}
$("#snd").onclick=()=>{mute=!mute;$("#snd").textContent=mute?"🔇 Sound off":"🔊 Sound on"};
$("#lg").onclick=()=>{L=L==="en"?"uz":"en";$("#lg").textContent="🌐 "+L.toUpperCase();play()};
ov.onclick=btn.onclick=play;
build();show(0);
</script>
</body></html>
